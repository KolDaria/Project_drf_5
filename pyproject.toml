[tool.poetry]
name = "project-drf-5"
version = "0.1.0"
description = ""
authors = ["Daria Kolisnyk <dashamel17@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
django = "^5.2.4"
djangorestframework = "^3.16.0"
djangorestframework-simplejwt = "^5.5.1"
drf-yasg = "^1.21.10"
django-cors-headers = "^4.7.0"
requests = "^2.32.4"
celery = "^5.5.3"
eventlet = "^0.40.2"
python-dotenv = "^1.1.1"
psycopg2-binary = "^2.9.10"
django-celery-beat = "^2.8.1"
pillow = "^11.3.0"
django-filter = "^25.1"
coverage = "^7.10.2"
redis = "^6.4.0"
gunicorn = "^23.0.0"
django-redis = "^6.0.0"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
mypy = "^1.17.1"
isort = "^6.0.1"
black = "^25.1.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-cov = "^6.2.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'

[tool.black]
line-length = 119
exclude ="""
(
    /)
        /.git
      | /.eggs
      | /.mypy_cache
      | /.venv
    (/
    | foo.py
)
"""

[tool.isort]
line_length = 119
